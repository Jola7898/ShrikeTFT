; ShrikeTFT - ST7789 2.4" 240x320 SPI display on the Vicharak Shrike-Fi
; The whole TFT_eSPI setup lives in build_flags below, so the library's
; own User_Setup.h is never touched.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1      ; Shrike-Fi uses an ESP32-S3FN8 (8MB flash, no PSRAM)
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    ; Serial over the board's USB, same as the Shrike examples
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

    ; --- Display driver ---
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_OFF=1      ; my panel shows inverted colours without this
    ; -D TFT_RGB_ORDER=TFT_BGR  ; uncomment if red and blue come out swapped

    ; Needed on the S3 with Arduino core 2.0.x. Without it TFT_eSPI writes to
    ; the wrong SPI peripheral and the screen never gets any data.
    -D USE_FSPI_PORT=1

    ; --- Pins (IO33-38 are the S3's native FSPI pins on the right header) ---
    ; Don't use GPIO8-13: the ESP32 talks to the FPGA on those.
    -D TFT_MISO=37
    -D TFT_MOSI=35
    -D TFT_SCLK=36
    -D TFT_CS=34
    -D TFT_DC=33
    -D TFT_RST=38
    -D TFT_BL=18
    -D TFT_BACKLIGHT_ON=HIGH

    ; --- Fonts ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    ; --- SPI speed ---
    -D SPI_FREQUENCY=40000000   ; drop to 27000000 if you get glitches
    -D SPI_READ_FREQUENCY=20000000
